name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Create static entry page
        run: |
          pnpm exec vinext start --host 127.0.0.1 --port 4173 > /tmp/vinext.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          mkdir -p dist/client/mi-app-daniel
          for attempt in {1..20}; do curl --fail --silent http://127.0.0.1:4173/mi-app-daniel/ > dist/client/mi-app-daniel/index.html && break; sleep 1; done
          cp -R dist/client/icons dist/client/levels dist/client/mi-app-daniel/
          cp dist/client/{.nojekyll,favicon.svg,og.png,study-tree.png} dist/client/mi-app-daniel/
          test -s dist/client/mi-app-daniel/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client/mi-app-daniel
      - id: deployment
        uses: actions/deploy-pages@v4
